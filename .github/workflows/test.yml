name: build

permissions: {}

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: vocs build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check cheatcode coverage
        run: pnpm run check:cheatcodes

      - name: Check anvil RPC coverage
        run: pnpm run check:anvil-rpc

      - name: Check narrative commands
        run: pnpm run check:commands

      - name: Check
        run: pnpm run check

      - name: Test
        run: pnpm run test

      - name: Build Vocs
        run: pnpm run build
