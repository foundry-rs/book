name: build

permissions: {}

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: vocs build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: vocs/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: vocs
        run: vp install --frozen-lockfile

      - name: Check
        working-directory: vocs
        run: vp check

      - name: Build Vocs
        working-directory: vocs
        run: vp run build
