name: build

permissions: {}

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: vocs build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          cache: true
          run-install: true

      - name: Check cheatcode coverage
        run: vp run check:cheatcodes

      - name: Check anvil RPC coverage
        run: vp run check:anvil-rpc

      - name: Check narrative commands
        run: vp run check:commands

      - name: Format, lint, and type-check
        run: vp check

      - name: Build Vocs
        run: vp run build
