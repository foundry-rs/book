name: build

permissions: {}

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          cache: true
          node-version: "24"
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check cheatcode coverage
        run: vp run check:cheatcodes

      - name: Check anvil RPC coverage
        run: vp run check:anvil-rpc

      - name: Check narrative commands
        run: vp run check:commands

      - name: Check
        run: vp run check

      - name: Test
        run: vp run test

  build:
    name: vocs build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          cache: true
          node-version: "24"
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build Vocs
        run: vp exec vocs build

      - name: Upload Vocs build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vocs-build
          path: dist/
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: browser smoke tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          cache: true
          node-version: "24"
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Download Vocs build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vocs-build
          path: dist/

      - name: Install Chromium
        run: vp exec playwright install --with-deps chromium

      - name: Browser smoke tests
        run: vp run test:e2e

      - name: Upload browser test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
