name: update

permissions: {}

on:
  schedule:
    # Run weekly
    - cron: "0 0 * * SUN"
  workflow_dispatch:
    # Needed so we can run it manually

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: nightly

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          cache: true
          node-version: "24"
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Resolve installed Foundry source
        id: foundry-source
        run: |
          foundry_commit="$(forge --version | sed -n 's/^Commit SHA: //p')"
          [[ "$foundry_commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$foundry_commit" >> "$GITHUB_OUTPUT"

      - name: Check out matching Foundry source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: foundry-rs/foundry
          ref: ${{ steps.foundry-source.outputs.commit }}
          path: .foundry-reference
          persist-credentials: false
          sparse-checkout: |
            crates/cheatcodes/assets
            crates/lint

      - name: Refresh cheatcode manifest
        env:
          FOUNDRY_COMMIT: ${{ steps.foundry-source.outputs.commit }}
        run: |
          vp run check:cheatcodes -- \
            --refresh --spec .foundry-reference/crates/cheatcodes/assets/cheatcodes.json \
            --commit "$FOUNDRY_COMMIT"

      - name: Refresh lint references
        run: vp run import:lints -- --foundry .foundry-reference

      - name: Remove temporary Foundry checkout
        run: rm -rf -- .foundry-reference

      - name: Refresh changelog data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: vp run fetch-changelog -- --strict

      - name: Update
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "<>"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          ./scripts/gen_output.sh

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "update command output"
          title: "chore(output): weekly command output update"
          body: |
            Automation to keep command output up to date.
          branch: chore/output-update
