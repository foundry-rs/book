services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.2
    environment:
      CLICKHOUSE_PASSWORD: local-dev
    ports:
      - '127.0.0.1:8123:8123'
      - '127.0.0.1:9000:9000'
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'clickhouse-client', '--query', 'SELECT 1']
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  clickhouse-data:
