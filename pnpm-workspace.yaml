catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  vitest: 5.0.3
packages:
  - perf
allowBuilds:
  es5-ext: false
  esbuild: true
  vue-demi: false
  workerd: true
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    typescript: "*"
    vite: "*"
overrides:
  # Shiki 4 splits tokens at decoration offsets in linear time; perf word diffs rely on it.
  "@pierre/diffs>shiki": ^4.5.0
  "@pierre/diffs>@shikijs/transformers": ^4.5.0
  "@pierre/theming>@shikijs/themes": ^4.5.0
  vite@*: "catalog:"
patchedDependencies:
  # TODO: remove once https://github.com/pierrecomputer/pierre/pull/1197 is released.
  "@pierre/diffs@1.5.2": patches/@pierre__diffs@1.5.2.patch
  # TODO: remove once https://github.com/shikijs/shiki/pull/1338 is released.
  "@shikijs/core@4.5.0": patches/@shikijs__core@4.5.0.patch
